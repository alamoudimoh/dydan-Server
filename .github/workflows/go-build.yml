name: Taskier Server CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core, build, and focused race tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore dependencies
        run: go mod download
      - name: Verify server
        run: TASKIER_SKIP_CONTAINER_SMOKE=true bash scripts/verify.sh

  zero-config-container:
    name: Zero-config container persistence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify Compose and fresh/restart container behavior
        run: bash scripts/verify-container.sh
