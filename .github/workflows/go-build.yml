name: DayDan Server CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core, build, and focused race tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore dependencies
        run: go mod download
      - name: Verify server
        run: DAYDAN_SKIP_CONTAINER_SMOKE=true bash scripts/verify.sh

  zero-config-container:
    name: Zero-config container persistence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frontend build context
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/daydan-app
          path: frontend-code
      - name: Verify Compose and fresh/restart container behavior
        env:
          DAYDAN_FRONTEND_CONTEXT: frontend-code
        run: bash scripts/verify-container.sh

  postgres-security:
    name: PostgreSQL security regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Ephemeral per-job instance: no external database, no shared state,
        # nothing persists beyond this run.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: daydan
          POSTGRES_PASSWORD: daydan
          POSTGRES_DB: daydan_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U daydan -d daydan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore dependencies
        run: go mod download
      - name: Run PostgreSQL security regression suite
        env:
          DAYDAN_TEST_POSTGRES_DSN: host=localhost port=54329 user=daydan password=daydan dbname=daydan_test sslmode=disable
        # Focused job on top of (not duplicating) the core suite: only tests
        # that exercise PostgreSQL-specific semantics. Race detector included.
        run: |
          go test ./internal/user/repo/ -run 'Postgres' -count=1 -race -v
