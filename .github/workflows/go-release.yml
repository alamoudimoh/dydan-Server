name: Go Release

permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0-beta.1)"
        required: true
        type: string
      frontend_ref:
        description: "Dydan AppWeb ref (tag/branch/SHA) to embed. Required for reproducible builds; empty = AppWeb develop HEAD (non-reproducible)."
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Push Docker Image
    steps:
      - name: Resolve release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$INPUT_TAG" ]; then
            echo "::error::Manual releases require an explicit tag."
            exit 1
          fi
          tag="${INPUT_TAG:-$PUSH_TAG}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag must be a v-prefixed semantic version, got: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      # The release image must embed the Dydan frontend, never the upstream
      # legacy project.
      #
      # Resolution rules:
      # - Official tagged release (push of a vX.Y.Z tag): the exact same tag
      #   must exist in the AppWeb repository; otherwise the job FAILS. Rebuilding the
      #   same server tag must never silently embed a moving branch such as
      #   develop.
      # - Manual dispatch: an explicit frontend_ref (tag/branch/full SHA) is
      #   used as-is. If omitted, AppWeb develop HEAD is used and the
      #   build is clearly identified as a non-reproducible development build.
      #
      # In every case the ref is resolved to one immutable commit SHA here,
      # once, and only that SHA is checked out and recorded as provenance, so
      # the frontend cannot move between resolution and build. The logic lives
      # in scripts/resolve-frontend-ref.sh so it can be tested locally.
      - name: Resolve frontend ref and pin its commit
        id: frontend-ref
        env:
          INPUT_REF: ${{ inputs.frontend_ref }}
          TAG: ${{ steps.resolve.outputs.tag }}
          IS_TAG_PUSH: ${{ github.event_name == 'push' }}
          REPO_URL: https://github.com/${{ github.repository_owner }}/DyDan-AppWeb.git
        run: bash scripts/resolve-frontend-ref.sh

      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/DyDan-AppWeb
          # Pin to the exact commit resolved above; never a moving ref.
          ref: ${{ steps.frontend-ref.outputs.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: "frontend-code"

      - name: Verify frontend checkout matches pinned commit
        run: |
          actual=$(git -C frontend-code rev-parse HEAD)
          expected=${{ steps.frontend-ref.outputs.sha }}
          if [ "$actual" != "$expected" ]; then
            echo "::error::Frontend checkout drift: expected $expected, got $actual"
            exit 1
          fi

      # The Dockerfile builds the frontend itself from the `frontend` named
      # context, so no separate npm install/build step is needed here.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # I added QEMU Emulation support for non-native architectures and also Buildx to enables multi-architecture. not sure if there is better/faster way to do this
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve commit SHA
        id: commit
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract Docker tags
        id: meta
        run: |
          VERSION=${{ steps.resolve.outputs.tag }}
          DYDAN_IMAGE=ghcr.io/${{ github.repository_owner }}/dydan

          # Check if this is a pre-release (contains -, like v1.0.0-beta.1)
          if [[ "$VERSION" =~ - ]]; then
            # Extract pre-release channel (alpha, beta, rc, etc.)
            CHANNEL=$(echo "$VERSION" | sed -E 's/v[0-9]+\.[0-9]+\.[0-9]+-([a-z]+).*/\1/')
            echo "Pre-release detected: $VERSION (channel: $CHANNEL)"
            echo "tags=${DYDAN_IMAGE}:${VERSION},${DYDAN_IMAGE}:${CHANNEL}" >> $GITHUB_OUTPUT
          else
            echo "Stable release detected: $VERSION"
            echo "tags=${DYDAN_IMAGE}:latest,${DYDAN_IMAGE}:${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-contexts: |
            frontend=./frontend-code
          build-args: |
            VERSION=${{ steps.resolve.outputs.tag }}
            COMMIT=${{ steps.commit.outputs.sha }}
            DYDAN_FRONTEND_COMMIT=${{ steps.frontend-ref.outputs.sha }}
            DYDAN_FRONTEND_REF=${{ steps.frontend-ref.outputs.ref }}

      # Provenance is written to the run summary and baked into the image as
      # OCI labels (see Dockerfile), so the server/frontend pairing of a
      # published image is always discoverable.
      - name: Record build provenance
        run: |
          {
            echo "## Release provenance"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Server repository | \`${{ github.repository }}\` |"
            echo "| Server version | \`${{ steps.resolve.outputs.tag }}\` |"
            echo "| Server commit | \`${{ steps.commit.outputs.sha }}\` |"
            echo "| Frontend repository | \`${{ github.repository_owner }}/DyDan-AppWeb\` |"
            echo "| Frontend ref | \`${{ steps.frontend-ref.outputs.ref }}\` |"
            echo "| Frontend commit | \`${{ steps.frontend-ref.outputs.sha }}\` |"
            echo "| Image tags | \`${{ steps.meta.outputs.tags }}\` |"
            if [ "${{ steps.frontend-ref.outputs.reproducible }}" = "true" ]; then
              echo ""
              echo "✅ Reproducible release: server tag and frontend ref are immutable."
            else
              echo ""
              echo "⚠️ **Non-reproducible development build**: frontend resolved from moving branch \`develop\`. Do not treat this image as a release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
