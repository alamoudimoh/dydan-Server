name: Go Release

permissions:
  contents: write
  
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0-beta.1)'
        required: false
        type: string
      frontend_ref:
        description: 'daydan-app ref (tag/branch/SHA) to embed. Empty = matching tag if synchronized, else develop.'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Push Docker Image
    steps:
      - name: Resolve release tag
        id: resolve
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT

      # The release image must embed the DayDan frontend, never upstream
      # Donetick. Ref strategy (documented limitation): the two repositories do
      # not share synchronized version tags, so by default releases pair with
      # the app's established develop branch; a matching tag is preferred if it
      # ever exists, and frontend_ref allows pinning any ref explicitly.
      - name: Resolve frontend ref
        id: frontend-ref
        env:
          INPUT_REF: ${{ inputs.frontend_ref }}
          TAG: ${{ steps.resolve.outputs.tag }}
          REPO_URL: https://github.com/${{ github.repository_owner }}/daydan-app.git
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
            echo "Using explicit frontend ref: $REF"
          elif git ls-remote --exit-code --tags "$REPO_URL" "refs/tags/$TAG" >/dev/null 2>&1; then
            REF="$TAG"
            echo "Found synchronized frontend tag: $REF"
          else
            REF="develop"
            echo "No synchronized frontend tag for $TAG; using stable branch: $REF"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/daydan-app
          ref: ${{ steps.frontend-ref.outputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: 'frontend-code'

      - name: Resolve frontend commit
        id: frontend-commit
        run: |
          sha=$(git -C frontend-code rev-parse HEAD)
          echo "Frontend commit: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The Dockerfile builds the frontend itself from the `frontend` named
      # context, so no separate npm install/build step is needed here.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true 

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          # 'latest', 'nightly', or a semver
          version: latest
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # I added QEMU Emulation support for non-native architectures and also Buildx to enables multi-architecture. not sure if there is better/faster way to do this
      - name: Set up QEMU 
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve commit SHA
        id: commit
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract Docker tags
        id: meta
        run: |
          VERSION=${{ steps.resolve.outputs.tag }}
          DOCKER_USER=${{ secrets.DOCKER_USERNAME }}

          # Check if this is a pre-release (contains -, like v1.0.0-beta.1)
          if [[ "$VERSION" =~ - ]]; then
            # Extract pre-release channel (alpha, beta, rc, etc.)
            CHANNEL=$(echo "$VERSION" | sed -E 's/v[0-9]+\.[0-9]+\.[0-9]+-([a-z]+).*/\1/')
            echo "Pre-release detected: $VERSION (channel: $CHANNEL)"
            echo "tags=${DOCKER_USER}/donetick:${VERSION},${DOCKER_USER}/donetick:${CHANNEL}" >> $GITHUB_OUTPUT
          else
            echo "Stable release detected: $VERSION"
            echo "tags=${DOCKER_USER}/donetick:latest,${DOCKER_USER}/donetick:${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-contexts: |
            frontend=./frontend-code
          build-args: |
            VERSION=${{ steps.resolve.outputs.tag }}
            COMMIT=${{ steps.commit.outputs.sha }}
            DAYDAN_FRONTEND_COMMIT=${{ steps.frontend-commit.outputs.sha }}

      # Provenance is written to the run summary and baked into the image as an
      # OCI label (see Dockerfile), so the embedded frontend commit is always
      # discoverable for a published image.
      - name: Record build provenance
        run: |
          {
            echo "## Release provenance"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Server commit | \`${{ steps.commit.outputs.sha }}\` |"
            echo "| Frontend repository | \`${{ github.repository_owner }}/daydan-app@${{ steps.frontend-ref.outputs.ref }}\` |"
            echo "| Frontend commit | \`${{ steps.frontend-commit.outputs.sha }}\` |"
            echo "| Image tags | \`${{ steps.meta.outputs.tags }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
