# Dydan does not require a configuration file. This file only demonstrates
# optional advanced overrides; copy only the settings you actually need.
#
# Preferred runtime config filenames: dydan.yaml or dydan.yml.
#
# Canonical environment overrides:
#   DYDAN_DATA_DIR, DYDAN_CONFIG_FILE, DYDAN_JWT_SECRET, DYDAN_SQLITE_PATH

# data_dir: /data
# is_user_creation_disabled: true
# server:
#   port: 7171
# logging:
#   level: info
# database:
#   type: postgres
#   host: postgres
#   port: 5432
#   user: dydan
#   password: use-a-secret-manager
#   name: dydan
#   # Connection-pool bounds (defaults: 25 open / 5 idle, 1h lifetime,
#   # 10m idle timeout). Size max_open_conns below your PostgreSQL
#   # max_connections when running multiple replicas.
#   max_open_conns: 25
#   max_idle_conns: 5
#
# Storage / media credentials:
#
# storage:
#   storage_type: local          # "local" (filesystem + HMAC-signed URLs) or "s3"
#   # Lifetime minted into signed media URLs. Clients re-sign expired URLs
#   # transparently via /api/v1/files/sign, so this can be shortened freely.
#   signed_url_ttl: 168h         # hard cap: 168h (7d, the AWS SigV4 maximum)
#   # Independent media-URL signing key. Leave unset to derive a
#   # storage-specific key from jwt.secret (HKDF domain-separated — never the
#   # raw JWT key). Set explicitly to rotate media URLs without rotating login
#   # sessions:
#   # media_secret: <32+ random chars>
#   # media_secret_file: /data/media-secret
#   # S3 options:
#   bucket_name:
#   region:
#   base_path:
#   access_key:
#   secret_key:
#   endpoint:
#   path_style: false
#   # public_read serves objects ANONYMOUSLY READABLE: it returns unsigned
#   # URLs and expects the bucket/prefix to have a policy allowing public
#   # GETs. Only enable this on a bucket you have deliberately made publicly
#   # readable — protected uploads in that bucket become world-readable too.
#   # Requires bucket_name to be set.
#   public_read: false
#   # Optional dedicated bucket/host for intentionally-public assets such as
#   # profile photos. Objects saved through SavePublic go here when set;
#   # everything else stays in the private bucket above.
#   # public_bucket_name:
#   # public_bucket_host:
#
# Circle webhook delivery (chore/thing events POSTed to a URL set by a Plus
# circle admin):
#
# webhook:
#   timeout: 5s
#   queue_size: 100
#   # allow_private_networks: false
#   # Webhook destinations on loopback/RFC1918/link-local addresses are
#   # REJECTED by default so an authenticated circle admin cannot pivot
#   # server requests into your internal network (SSRF). If your consumers
#   # legitimately live on the LAN (Home Assistant, internal alerting, ...),
#   # opt in explicitly here or via DT_WEBHOOK_ALLOW_PRIVATE_NETWORKS=true.
