name: "selfhosted"
is_done_tick_dot_com: false
is_user_creation_disabled: false
telegram:
  token: ""
pushover:
  token: ""
database:
  type: "sqlite"
  migration: true
  # these are only required for postgres
  host: "secret"
  port: 5432
  user: "secret"
  password: "secret"
  name: "secret"
jwt:
  secret: "change_this_to_a_secure_random_string_32_characters_long"
  session_time: 168h # 7 days
  max_refresh: 1440h # 60 days 
server:
  port: 7171
  read_timeout: 10s
  write_timeout: 10s
  rate_period: 60s
  rate_limit: 300
  rate_limit_auth_period: 60s
  rate_limit_auth: 10
  rate_limit_recovery_period: 1h
  rate_limit_recovery: 5
  rate_limit_max_active_buckets: 100000
  cors_allow_origins:
    - "http://localhost:5173"
    - "http://localhost:2925"
    - "http://localhost:7926"
    # the below are required for the android app to work
    - "https://localhost"
    - "http://localhost"
    - "capacitor://localhost"
  serve_frontend: true
  # API documentation is disabled by default in self-hosted deployments to
  # avoid publicly exposing API internals. Enable explicitly if wanted:
  serve_swagger: false
  public_host: "" # example: https://yourpublicdomain.com
logging:
  level: "info"
  encoding: "json"
  development: false
scheduler_jobs:
  due_job: 30m
  overdue_job: 3h
  pre_due_job: 3h
email:
  host:
  port:
  key:
  email:
  user: # optional, will be filled with email.email if not set.
  app_host:
  log_raw_url: false # never expose live password-reset links in normal self-hosted logs
oauth2:
  client_id:
  client_secret:
  auth_url:
  token_url:
  user_info_url:
  redirect_url:
  # Exact additional browser callback URLs; CORS origins are not trusted as
  # OAuth redirect destinations.
  allowed_redirect_urls: []
  name:
  # OIDC group-based role mapping (optional).
  # Users in these groups get the corresponding role on every OIDC login.
  # admin_groups:
  #   - "dydan-admins"
  # manager_groups:
  #   - "dydan-managers"
# Single-circle instance mode (optional).
# When true, disables circle join/leave endpoints and adds new OIDC users
# to a shared household circle instead of creating personal circles.
# single_circle_instance: false
# SSO-only mode (optional).
# When true, all password-based auth (signup, login, reset) is rejected and
# the login UI hides the password form.
# disable_password_auth: false
# Real-time configuration
realtime:
  enabled: true
  sse_enabled: true
  # heartbeat_interval is also the SSE revocation-propagation bound: values
  # <=0 fall back to 30s and values >5m are clamped to 5m server-side.
  heartbeat_interval: 60s
  connection_timeout: 120s
  max_connections: 1000
  max_connections_per_user: 5
  event_queue_size: 2048
  cleanup_interval: 2m
  stale_threshold: 5m
  enable_compression: true
  enable_stats: true
  allowed_origins:
    - "*"
