---
services:
  daydan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daydan
    restart: unless-stopped
    ports:
      - "2021:2021"
    volumes:
      - daydan-data:/data

volumes:
  daydan-data:
    name: ${DAYDAN_DOCKER_VOLUME:-${TASKIER_DOCKER_VOLUME:-daydan-data}}
