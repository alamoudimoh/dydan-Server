---
services:
  dydan:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        frontend: ${DYDAN_FRONTEND_CONTEXT:-../dydan-app}
      args:
        VERSION: ${DYDAN_VERSION:-dev}
        COMMIT: ${DYDAN_COMMIT:-local}
    container_name: dydan
    restart: unless-stopped
    ports:
      - "2021:2021"
    volumes:
      - dydan-data:/data

  # Optional one-shot backup job. Not started with the default profile:
  #   docker compose run --rm backup            # single backup
  #   docker compose --profile backup up        # then stop when done
  # Retention keeps DYDAN_BACKUP_KEEP (default 7) newest backups.
  # See docs/backup-restore.md for scheduled/host-cron examples and restore.
  backup:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        frontend: ${DYDAN_FRONTEND_CONTEXT:-../dydan-app}
      args:
        VERSION: ${DYDAN_VERSION:-dev}
        COMMIT: ${DYDAN_COMMIT:-local}
    container_name: dydan-backup
    entrypoint: ["/usr/local/bin/dydanctl"]
    command: ["backup", "--data-dir", "/data", "--out", "/backups",
                "--keep", "${DYDAN_BACKUP_KEEP:-7}"]
    volumes:
      - dydan-data:/data
      - ${DYDAN_BACKUP_DIR:-./dydan-backups}:/backups

volumes:
  dydan-data:
    name: ${DYDAN_DOCKER_VOLUME:-dydan-data}
